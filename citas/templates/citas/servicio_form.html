{% extends "citas/base.html" %}

{% block title %}
{{ titulo }} | Clínica Estética
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    {{ titulo }}
                </h2>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Guardar
                        </button>

                        <a
                            href="{% url 'servicios' %}"
                            class="btn btn-outline-secondary"
                        >
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
