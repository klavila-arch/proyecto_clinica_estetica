<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Clínica Estética{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f4f2;
            color: #493c39;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #7b5e57;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .hero {
            background-color: #eadfd9;
            border-radius: 18px;
            padding: 50px 35px;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-weight: bold;
        }

        .card {
            border: none;
            border-radius: 16px;
        }

        .btn-clinica {
            background-color: #9b7469;
            color: white;
            border: none;
        }

        .btn-clinica:hover {
            background-color: #7b5e57;
            color: white;
        }

        footer {
            margin-top: 60px;
            padding: 25px 0;
            text-align: center;
            color: #7a6c68;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'inicio' %}">
            Clínica Estética
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="menuPrincipal"
        >

            <div class="navbar-nav ms-auto">

                <a
                    class="nav-link"
                    href="{% url 'inicio' %}"
                >
                    Inicio
                </a>

                <a
                    class="nav-link"
                    href="{% url 'login' %}"
                >
                    Iniciar sesión
                </a>

                <a
                    class="nav-link"
                    href="/admin/"
                    target="_blank"
                >
                    Administración
                </a>

            </div>

        </div>

    </div>
</nav>


<main class="container py-5">

    {% block content %}
    {% endblock %}

</main>


<footer>
    Sistema web de gestión y reservación de citas
</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
